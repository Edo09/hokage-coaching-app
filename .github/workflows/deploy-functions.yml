# Deploys the Supabase Edge Functions (supabase/functions) to the Hokage
# project. Runs on its own when function code changes on main, or by hand:
# Actions → Deploy Edge Functions → Run workflow.
#
# One-time setup: a Supabase access token (dashboard → avatar → Account
# preferences → Access Tokens) saved as the repository secret
# SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
#
# Function secrets (ALLOWED_ORIGINS, GEMINI_API_KEY, GROQ_API_KEY) are not
# set here: set them in the dashboard (Edge Functions → Secrets).

name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rzgwkwxskrovxnnymxqo
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the top of this workflow)."
            exit 1
          fi

      # Each function is deployed with the shared code it imports from
      # supabase/functions/_shared, which the dashboard editor can't do.
      - name: Deploy
        run: |
          for fn in create-client reset-client-password ai-complete generate-program; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
