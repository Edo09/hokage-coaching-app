# Deploys the Supabase Edge Functions (supabase/functions) to the Hokage
# project. Runs on its own when function code or this file changes on main,
# or by hand: Actions → Deploy Edge Functions → Run workflow.
#
# One-time setup: a Supabase access token (dashboard → avatar → Account
# preferences → Access Tokens) saved as the repository secret
# SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
#
# Function secrets (ALLOWED_ORIGINS, GEMINI_API_KEY, GROQ_API_KEY,
# ESTIMATE_MEAL_SECRET, and the optional test-only ESTIMATE_FAIL_USER_ID) are
# not set here: set them in the dashboard (Edge Functions → Secrets).
# ESTIMATE_MEAL_SECRET also goes in Vault, with estimate-meal's URL
# (docs/ADMIN_WEB_DB_CONNECTION.md §6.6).

name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rzgwkwxskrovxnnymxqo
    steps:
      - uses: actions/checkout@v4

      # Pinned to the last v2: v3 (Nov 2026) fails unattended deploys that
      # don't pass --yes, which broke this job under `latest`. Before raising
      # it, add --yes to each deploy below.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the top of this workflow)."
            exit 1
          fi

      # Each function is deployed with the shared code it imports from
      # supabase/functions/_shared, which the dashboard editor can't do.
      - name: Deploy
        run: |
          for fn in create-client reset-client-password ai-complete generate-program generate-nutrition-plan; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
          # estimate-meal is called by the database (pg_net) with its own secret, not a user JWT.
          echo "::group::estimate-meal"
          supabase functions deploy estimate-meal --project-ref "$PROJECT_REF" --no-verify-jwt
          echo "::endgroup::"
